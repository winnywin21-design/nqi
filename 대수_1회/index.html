<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>대수 · 제1회 모의평가 · 채점 &amp; 오답노트</title>
<style>
:root{--navy:#1F3864;--ink:#1f2328;--mut:#6b7280;--line:#e5e7eb;--bg:#f7f8fa;--card:#fff;--ok:#1d9e75;--okbg:#e1f5ee;--no:#e24b4a;--nobg:#fcebeb;--accent:#185fa5;--accbg:#e6f1fb;--warn:#ba7517;--head:#1F3864;--barc:#1F3864;--field:#fff;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding:16px}
.wrap{max-width:680px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.head h1{font-size:18px;color:var(--head);font-weight:700}
.head .sub{font-size:13px;color:var(--mut);margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--accbg);color:var(--accent);font-size:12px;padding:5px 10px;border-radius:8px;white-space:nowrap}
.note{font-size:13px;color:var(--mut);margin:10px 0 16px}
.omrhead{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.omrhead .pill{background:#b25566;color:#fff;font-weight:700;font-size:15px;padding:6px 14px;border-radius:8px;white-space:nowrap}
.omrhead .htitle{font-size:16px;font-weight:700;color:var(--ink)}
.omrhead .logo{margin-left:auto;height:16px;width:auto;flex:none}
.cambtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:100%;min-height:208px;background:linear-gradient(160deg,#2a4c83 0%,#1F3864 58%,#162a4d 100%);color:#fff;border-radius:16px;cursor:pointer;box-shadow:0 8px 28px rgba(31,56,100,.34);border:2px dashed rgba(255,255,255,.30);position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
.cambtn::before{content:"";position:absolute;top:-40%;left:-30%;width:70%;height:180%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);transform:rotate(18deg)}
.cambtn:active{transform:translateY(1px);box-shadow:0 5px 18px rgba(31,56,100,.34)}
.cambtn .camicon{display:flex;align-items:center;justify-content:center;font-size:58px;line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));animation:campulse 2.2s ease-in-out infinite}
.cambtn .camlabel{font-size:21px;font-weight:800;letter-spacing:.4px}
.cambtn .camsub{font-size:13px;font-weight:500;color:rgba(255,255,255,.78)}
@keyframes campulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@media(prefers-reduced-motion:reduce){.cambtn .camicon{animation:none}}
.camtip{text-align:center;font-size:15px;color:var(--head);margin-top:14px;font-weight:700;line-height:1.5}
.camtip b{color:#e0562f;font-weight:800}
.camhint{text-align:center;font-size:12.5px;color:var(--mut);margin-top:6px}
.result{border-radius:10px;padding:12px 14px;font-size:14.5px;font-weight:700;margin-bottom:14px;line-height:1.45}
.result.ok{background:var(--okbg);color:var(--ok)}
.result.warn{background:#fff4e5;color:var(--warn)}
/* 촬영 완료 후: 촬영 박스를 작은 '다시 촬영' 버튼으로 축소 */
#capture-area.done .cambtn{min-height:48px;flex-direction:row;gap:8px;background:var(--field);border:1px solid var(--line);color:var(--head);box-shadow:none}
#capture-area.done .cambtn::before{display:none}
#capture-area.done .cambtn .camicon{font-size:18px;filter:none;animation:none}
#capture-area.done .cambtn .camlabel{font-size:14px;letter-spacing:0}
#capture-area.done .cambtn .camsub{display:none}
#capture-area.done .camtip{display:none}
.ordiv{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;margin:18px 0 12px}
.ordiv::before,.ordiv::after{content:"";flex:1;height:1px;background:var(--line)}
.ghostbtn{display:block;width:100%;height:44px;background:var(--field);border:1px solid var(--line);border-radius:9px;color:var(--ink);font-size:14px;font-weight:600;cursor:pointer}
.ghostbtn:active{background:var(--bg)}
#omr-msg{display:block;text-align:center;font-size:13px;color:var(--mut);margin-top:8px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.q{background:var(--bg);border-radius:8px;padding:9px 11px}
.qh{display:flex;align-items:baseline;gap:6px;margin-bottom:7px}
.qh .n{font-size:14px;font-weight:600}.qh .u{font-size:11px;color:var(--mut)}.qh .f{font-size:11px;color:var(--mut);margin-left:auto}
.opts{display:flex;gap:5px}
.opt{flex:1;height:30px;border:1px solid var(--line);background:var(--field);border-radius:8px;font-size:14px;color:var(--mut);cursor:pointer}
.opt.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=text]{width:100%;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:14px;background:var(--field);color:var(--ink)}
.btns{display:flex;gap:10px;margin-top:18px}
button.main{flex:1;background:var(--navy);color:#fff;border:none;height:42px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
button.sub{height:42px;padding:0 16px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:8px;font-size:14px;cursor:pointer}
.navbar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.navbar h1{font-size:18px;color:var(--head);font-weight:700}
.navbar .logo{margin-left:auto;height:16px;width:auto;flex:none}
.back{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;color:var(--mut);cursor:pointer;white-space:nowrap}
.tonote{width:100%;background:linear-gradient(135deg,#3f82d4 0%,#215ea6 100%);color:#fff;border:none;height:52px;border-radius:12px;font-size:15.5px;font-weight:800;letter-spacing:.3px;cursor:pointer;margin-top:26px;box-shadow:0 8px 20px rgba(33,94,166,.4)}
.tonote:active{transform:translateY(1px)}
.hero2{display:flex;align-items:center;gap:16px}
.ring{--p:0;width:96px;height:96px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#5db3ff calc(var(--p)*3.6deg),rgba(255,255,255,.16) 0)}
.ring-in{width:72px;height:72px;border-radius:50%;background:var(--navy);display:grid;place-items:center;text-align:center;line-height:1}
.ring-in b{font-size:26px;font-weight:800;color:#fff}
.ring-in b i{font-size:13px;font-style:normal;font-weight:700;margin-left:1px}
.hstats{flex:1;display:flex;flex-direction:column}
.hs{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.14)}
.hs:last-child{border-bottom:none}
.hs>span{font-size:12.5px;color:rgba(255,255,255,.72)}
.hs>b{font-size:19px;font-weight:800;color:#fff;letter-spacing:-.01em}
.hs>b i{font-size:12px;font-style:normal;font-weight:600;color:rgba(255,255,255,.55);margin-left:1px}
.hs>b.acc{color:#7cc0ff}
.sect{background:var(--navy);border:none;border-radius:16px;padding:16px 16px 18px;margin-top:0;box-shadow:0 4px 14px rgba(31,56,100,.18)}
#panel-score .sect+.sec{margin-top:24px}
.csub{font-size:11.5px;font-weight:700;color:rgba(255,255,255,.55);margin:0 0 8px}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(42px,1fr));gap:7px;margin-bottom:15px}
.chips:last-child{margin-bottom:0}
.chip{display:flex;align-items:center;justify-content:center;gap:5px;height:34px;border-radius:9px;font-size:13px;font-weight:700;color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10)}
.chip i{font-style:normal;font-weight:800}
.chip.ok{background:rgba(84,209,157,.14);border-color:rgba(84,209,157,.30)}
.chip.ok i{color:#54d19d}
.chip.no{background:rgba(255,141,139,.11);border-color:rgba(255,141,139,.26)}
.chip.no i{color:#ff8d8b}
.sec{position:relative;font-size:16px;font-weight:800;color:var(--head);margin:0 0 11px;padding-left:13px;letter-spacing:-.01em}
.sec::before{content:"";position:absolute;left:0;top:1px;bottom:1px;width:5px;border-radius:3px;background:var(--barc)}
.bar{margin-bottom:13px}.bar:last-child{margin-bottom:0}.bar .t{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:5px}
.bar .t>span:first-child{font-weight:600;color:#fff}
#panel-score .track{background:rgba(255,255,255,.18)}
.track{height:9px;background:var(--line);border-radius:99px;overflow:hidden}.fill{height:100%;border-radius:99px}
.onote{border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:12px;padding:14px 14px 16px;margin-bottom:14px}
.onote .oh{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;flex-wrap:wrap}
.onote .tag{background:var(--accbg);color:var(--head);font-weight:700;padding:2px 9px;border-radius:6px}
.onote .utag{background:var(--bg);color:var(--mut);padding:2px 8px;border-radius:6px}
.onote .ans{margin-left:auto;color:var(--mut)}
.cnum{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border:1.3px solid currentColor;border-radius:50%;font-size:11px;line-height:1;vertical-align:-2px}
.onote img{width:100%;border:1px solid var(--line);border-radius:8px;display:block;margin-bottom:12px}
.fld{margin-top:12px}
.fld .lab{font-size:12px;color:var(--head);font-weight:700;margin-bottom:6px}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
.rbtn{display:inline-block;-webkit-appearance:none;appearance:none;padding:6px 12px;border:1px solid var(--line);background:var(--field);border-radius:16px;font-size:13px;color:var(--mut);cursor:pointer;-webkit-user-select:none;user-select:none}
.rbtn.on{background:var(--accbg);color:var(--accent);border-color:var(--accent)}
textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;resize:vertical;background:var(--field);color:var(--ink)}
.review{display:flex;gap:14px}
.review label{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink);cursor:pointer}
.review input[type=checkbox]{-webkit-appearance:none;appearance:none;width:15px;height:15px;margin:0;border:1.5px solid #9aa0aa;border-radius:3px;background:var(--field);position:relative;cursor:pointer;flex:none}
.review input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.review input[type=checkbox]:checked::after{content:'✓';position:absolute;top:-2px;left:1.5px;color:#fff;font-size:12px;font-weight:700}
.allok{color:var(--ok);font-size:14px}
.omrbtn{display:inline-block;cursor:pointer}
.q.warn{outline:2px solid var(--warn);outline-offset:1px}
.q .warnbadge{color:var(--warn);font-size:11px;font-weight:700;margin-left:6px}
/* ▼ 다크모드 (화면 전용 — 인쇄는 항상 밝게 유지) */
@media screen and (prefers-color-scheme:dark){
 :root{--ink:#e7e9ee;--mut:#9aa1ad;--line:#333a45;--bg:#0f1216;--card:#1a1d23;--navy:#294670;--ok:#45c495;--okbg:#123528;--no:#f2726f;--nobg:#3a2220;--accent:#6aa8ea;--accbg:#1d2c40;--warn:#e0a94a;--head:#e7e9ee;--barc:#6aa8ea;--field:#20242c;}
 body{background:var(--bg)}
 .result.warn{background:#3a2c14;color:#e6b866}
 .tonote{background:linear-gradient(135deg,#4a90e2 0%,#2f6fbf 100%);box-shadow:0 8px 22px rgba(0,0,0,.5)}
 .omrhead .logo,.navbar .logo{background:#fff;padding:3px 6px;border-radius:5px;box-sizing:content-box}
}
@page{size:A4;margin:11mm}
@media print{
 body{background:#fff;padding:0}.wrap{border:none;padding:0;max-width:none}
 #view-input,#view-score{display:none!important}
 #view-note{display:block!important}
 .navbar,.sec,#panel-note>button{display:none!important}
 /* 한 문항 = A4 한 장, 풀이 칸이 남는 높이를 꽉 채움(하단 여백 제거) */
 .onote{break-inside:avoid;page-break-after:always;border:1px solid #bbb;padding:10px;margin:0;height:275mm;display:flex;flex-direction:column}
 .onote:last-child{page-break-after:auto}
 .onote .oh{margin-bottom:7px}
 .onote img{margin-bottom:8px;width:auto;max-width:100%;max-height:105mm;object-fit:contain}
 .fld{margin-top:8px}
 .fld.solve{flex:1;display:flex;flex-direction:column;min-height:0}
 .fld.solve textarea{flex:1;min-height:0}
 .rbtn,.review input[type=checkbox],.cnum{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .rbtn{background:#fff!important;color:#333!important;border:1px solid #999!important}
 .rbtn.on{background:#e6f1fb!important;color:#185fa5!important;border-color:#185fa5!important}
 .review input[type=checkbox]{border:1.5px solid #666!important;background:#fff!important}
 .review input[type=checkbox]:checked{background:#185fa5!important;border-color:#185fa5!important}
}
</style></head>

<script>// 순수 인식 로직: OpenCV 무관. 브라우저(전역 OMRCore)와 Node(module.exports) 공용.
(function (root) {
  const FILL_ON = 0.45;      // 이 이상이면 '칠함'
  const MARGIN = 0.20;       // 1등-2등 격차가 이보다 작으면 애매

  // 그레이스케일 버퍼에서 (cx,cy) 반지름 r 원 안의 '어두운' 픽셀 비율(0~1).
  function sampleFill(gray, width, height, cx, cy, r, darkThresh) {
    // 100: 학생이 칠한 '검정'만 어둡게 세고, 인쇄된 분홍 링·숫자(회색≈100~128)는 제외.
    // (128이면 실물 사진에서 인쇄 분홍까지 세어져 안 칠한 칸도 '칠함'으로 오판→중복)
    darkThresh = darkThresh == null ? 100 : darkThresh;
    let dark = 0, total = 0;
    for (let y = Math.max(0, cy - r); y <= Math.min(height - 1, cy + r); y++)
      for (let x = Math.max(0, cx - r); x <= Math.min(width - 1, cx + r); x++) {
        if ((x - cx) * (x - cx) + (y - cy) * (y - cy) > r * r) continue;
        total++;
        if (gray[y * width + x] < darkThresh) dark++;
      }
    return total ? dark / total : 0;
  }

  function _rank(fills) {
    const idx = fills.map((f, i) => [f, i]).sort((a, b) => b[0] - a[0]);
    return { top: idx[0], second: idx[1] || [0, -1] };
  }

  function decideMC(fills) {
    const { top, second } = _rank(fills);
    const on = fills.filter(f => f >= FILL_ON).length;
    let flag = "ok";
    if (on === 0 || top[0] < FILL_ON) flag = "blank";
    else if (on >= 2) flag = "multi";
    else if (top[0] - second[0] < MARGIN) flag = "ambiguous";
    return { opt: flag === "blank" ? null : top[1] + 1, flag };
  }

  function _decideDigit(fills) {
    const { top, second } = _rank(fills);
    const on = fills.filter(f => f >= FILL_ON).length;
    if (on === 0 || top[0] < FILL_ON) return { val: null, flag: "blank" };
    if (on >= 2) return { val: top[1], flag: "multi" };
    if (top[0] - second[0] < MARGIN) return { val: top[1], flag: "ambiguous" };
    return { val: top[1], flag: "ok" };
  }

  function assembleDigits(places) {
    // 칠한 자리만 순서대로 이어붙인다. 학생이 왼쪽정렬로 칠하든 오른쪽정렬로 칠하든
    // (예: "64"를 백·십 칸에 칠해도, 십·일 칸에 칠해도) 같은 64가 되도록.
    const ds = places.map(_decideDigit);
    const idx = ds.map((d, i) => (d.flag !== "blank" ? i : -1)).filter(i => i >= 0);
    let flag = "ok";
    if (ds.some(d => d.flag === "multi")) flag = "multi";
    else if (ds.some(d => d.flag === "ambiguous")) flag = "ambiguous";
    if (idx.length === 0) return { value: null, flag: "blank", digits: ds };
    if (idx[idx.length - 1] - idx[0] + 1 !== idx.length) flag = "ambiguous"; // 칠한 칸 사이 빈칸
    const value = parseInt(idx.map(i => ds[i].val).join(""), 10);
    return { value, flag, digits: ds };
  }

  function decodeRoundId(gray, w, h, spec) {
    let id = 0;
    for (const cell of (spec.codeCells || [])) {
      const cx = Math.round(cell.x * w), cy = Math.round(cell.y * w);
      const r = Math.round(cell.size * w * 0.4);
      const f = sampleFill(gray, w, h, cx, cy, r);
      id = (id << 1) | (f >= FILL_ON ? 1 : 0);      // MSB first
    }
    return id;
  }

  function interpretCard(gray, w, h, spec) {
    const R = Math.round((spec.bubbles[0] ? spec.bubbles[0].r : 0.02) * w * 0.8);
    const fill = b => sampleFill(gray, w, h, Math.round(b.x * w), Math.round(b.y * w), R);
    const byQ = {};
    for (const b of spec.bubbles) (byQ[b.q] = byQ[b.q] || []).push(b);
    const answers = {}, flags = {};
    for (const q of Object.keys(byQ)) {
      const bs = byQ[q];
      if (bs[0].kind === "mc") {
        const fills = []; bs.forEach(b => fills[b.opt - 1] = fill(b));
        const d = decideMC(fills);
        answers[q] = { kind: "mc", value: d.opt }; flags[q] = d.flag;
      } else {
        const places = [];
        bs.forEach(b => { (places[b.place] = places[b.place] || [])[b.val] = fill(b); });
        const d = assembleDigits(places);

      }

  }

  const api = { sampleFill, decideMC, assembleDigits, decodeRoundId, interpretCard };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else { root.OMRCore = api; }
})(typeof globalThis !== "undefined" ? globalThis : this);

// OpenCV 래퍼(브라우저 전용, cv = OpenCV.js).
// 계약: detectAndWarp(imgElement, spec) → {gray:Uint8Array,width,height} | null
// 로직 정확도는 실제 폰 프로토콜(Plan B Phase 5)로 검증. _orderQuad만 Node 단위테스트.
(function (root) {
  // 사각형 후보들 중 '네 극단점'을 코너 마커로 고른다(좌상,우상,우하,좌하).
  // 크기로 고르면 칠한 답 버블(코너 마커와 크기 비슷)이 섞여 깨지므로, 위치 극단으로 고른다.
  function _pickCorners(pts) {
    var TL, TR, BR, BL, minS = Infinity, maxS = -Infinity, minD = Infinity, maxD = -Infinity;
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i], s = p.x + p.y, d = p.x - p.y;
      if (s < minS) { minS = s; TL = p; }
      if (s > maxS) { maxS = s; BR = p; }
      if (d > maxD) { maxD = d; TR = p; }
      if (d < minD) { minD = d; BL = p; }
    }
    return [TL, TR, BR, BL];
  }

  // 어수선한 배경(툴바·화면 테두리 등)에서도 카드 마크 4개를 견고하게 고른다.
  // 아이디어: 후보를 '마크다움(solidity×면적)' 상위로 추려, 그중 카드 종횡비(expAspect)에
  // 맞는 사각형을 이루는 4점 조합을 찾는다. 잡음(툴바)·버블(원)은 종횡비/solidity로 탈락.
  function _quadMetrics(q) {
    var d = function (a, b) { return Math.hypot(a.x - b.x, a.y - b.y); };
    var w = (d(q[0], q[1]) + d(q[3], q[2])) / 2;   // (TL-TR + BL-BR)/2
    var h = (d(q[0], q[3]) + d(q[1], q[2])) / 2;   // (TL-BL + TR-BR)/2
    return { w: w, h: h, area: w * h, asp: h / (w || 1) };
  }
  function pickCardQuad(cands, expAspect) {
    if (!cands || cands.length < 4) return null;
    // 마크다움 점수(solidity×면적)로 상위 후보만 남겨 조합 수를 줄인다.
    var scored = cands.map(function (c) {
      return { x: c.x, y: c.y, area: c.area, s: (c.fill == null ? 1 : c.fill) * c.area };
    }).sort(function (a, b) { return b.s - a.s; });
    var top = scored.slice(0, Math.min(scored.length, 28));
    var best = null, bestScore = -Infinity, n = top.length;
    for (var i = 0; i < n; i++) for (var j = i + 1; j < n; j++)
      for (var k = j + 1; k < n; k++) for (var l = k + 1; l < n; l++) {
        var ar = [top[i].area, top[j].area, top[k].area, top[l].area];
        var unif = Math.min.apply(null, ar) / Math.max.apply(null, ar); // 마크 4개 크기 균일도
        if (unif < 0.55) continue;    // 크기 제각각이면 마크 아님(큰 버튼·UI요소 혼입 제거)
        var q = _pickCorners([top[i], top[j], top[k], top[l]]);
        var m = _quadMetrics(q);
        if (m.w < 12 || m.h < 12) continue;
        var aspErr = Math.abs(m.asp - expAspect) / expAspect;
        if (aspErr > 0.45) continue;                 // 카드 종횡비와 안 맞으면 제외
        // 반듯한 직사각형인가(마주보는 변 길이가 비슷). 사다리꼴(엉뚱한 4점)이면 제외.
        var dd = function (a, b) { return Math.hypot(a.x - b.x, a.y - b.y); };
        var tw = dd(q[0], q[1]), bw = dd(q[3], q[2]), lh = dd(q[0], q[3]), rh = dd(q[1], q[2]);
        if (Math.min(tw, bw) / Math.max(tw, bw) < 0.6) continue;
        if (Math.min(lh, rh) / Math.max(lh, rh) < 0.6) continue;
        // 균일·종횡비 통과한 것 중 가장 큰 사각형(=내부 버블격자보다 바깥의 마크가 이김)
        var score = m.area * (1 - aspErr) * unif;
        if (score > bestScore) { bestScore = score; best = q; }
      }
    return best;
  }

  // 마커의 '정규화 위치'(폭 단위)를 출력 좌표로 보내는 목적지 점(좌상,우상,우하,좌하).
  // omr-core가 좌표를 x*outW, y*outW로 읽으므로 마커도 같은 규칙으로 펴야 정합.
  // markers 입력 순서는 [좌상,우상,좌하,우하](cardspec 순).
  function _contentDst(markers, outW) {
    const o = [markers[0], markers[1], markers[3], markers[2]]; // → 좌상,우상,우하,좌하
    return o.flatMap(m => [m.x * outW, m.y * outW]);
  }

  function detectAndWarp(imgEl, spec, outW) {
    outW = outW || 800;
    const outH = Math.round(outW * spec.heightUnits);
    const src0 = cv.imread(imgEl);
    // 고해상도 사진에서 큰 마크가 적응형이진화(블록31)로 속이 비어 사각형 필터에 탈락하는 것을
    // 방지: 작업 해상도(폭 1000px)로 축소해 마크가 적당히 작아지게 한다(해상도 독립·속도↑).
    const WORK = 1000;
    let src;
    if (src0.cols > WORK) {
      src = new cv.Mat();
      cv.resize(src0, src, new cv.Size(WORK, Math.round(src0.rows * WORK / src0.cols)),
        0, 0, cv.INTER_AREA);
      src0.delete();
    } else {
      src = src0;
    }
    const gray = new cv.Mat();
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    const bin = new cv.Mat();
    cv.adaptiveThreshold(gray, bin, 255, cv.ADAPTIVE_THRESH_MEAN_C,
      cv.THRESH_BINARY_INV, 31, 10);
    const contours = new cv.MatVector(), hier = new cv.Mat();
    cv.findContours(bin, contours, hier, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);
    const sq = [];
    for (let i = 0; i < contours.size(); i++) {
      const cnt = contours.get(i), area = cv.contourArea(cnt);
      if (area < 100) continue;
      const rect = cv.boundingRect(cnt);
      const ar = rect.width / rect.height;
      if (ar > 0.6 && ar < 1.6 && area > 0.5 * rect.width * rect.height)
        sq.push({ x: rect.x + rect.width / 2, y: rect.y + rect.height / 2,
          area: area, fill: area / (rect.width * rect.height) });
    }
    let result = null;
    if (sq.length >= 4) {
      const my = spec.markers.map(m => m.y), mx = spec.markers.map(m => m.x);
      const expAspect = (Math.max(...my) - Math.min(...my)) / (Math.max(...mx) - Math.min(...mx));
      const quad = pickCardQuad(sq, expAspect) || _pickCorners(sq);  // 종횡비 매칭 우선, 실패 시 극단점
      const srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, quad.flatMap(p => [p.x, p.y]));
      const dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, _contentDst(spec.markers, outW));
      const M = cv.getPerspectiveTransform(srcTri, dstTri);
      const warped = new cv.Mat();
      cv.warpPerspective(gray, warped, M, new cv.Size(outW, outH));
      const out = new Uint8Array(outW * outH);
      for (let i = 0; i < out.length; i++) out[i] = warped.data[i];
      result = { gray: out, width: outW, height: outH };
      srcTri.delete(); dstTri.delete(); M.delete(); warped.delete();
    }
    src.delete(); gray.delete(); bin.delete(); contours.delete(); hier.delete();
    return result;
  }

  root.OMRCv = { detectAndWarp, _pickCorners, pickCardQuad, _quadMetrics, _contentDst };
})(typeof globalThis !== "undefined" ? globalThis : this);

// 촬영 → 인식 → 입력화면 자동채움. CARDSPEC/META/picks/grid 전역 사용.
(function () {
  if (!window.CARDSPEC) return;                       // 규격 없으면 촬영 비활성
  var cam = document.getElementById('omr-cam');
  var file = document.getElementById('omr-file');
  var msg = document.getElementById('omr-msg');
  if (!cam || !file) return;

  // 일부 OpenCV.js 빌드는 cv를 Promise로 노출 → 해소해 전역에 얹는다.
  if (window.cv && typeof window.cv.then === 'function') {
    window.cv.then(function (m) { window.cv = m; });
  }
  function ready() { return window.cv && window.cv.Mat && window.OMRCv && window.OMRCore; }

  var tries = 0;
  (function wait() {
    if (ready()) { cam.style.display = 'block'; return; }
    if (tries++ > 40) return;                          // ~20초 후 포기(촬영 숨김, 수동입력만)
    setTimeout(wait, 500);
  })();

  function setPick(q, kind, value) {
    var qel = grid.querySelector('[data-q="' + q + '"]');
    if (!qel) return;
    if (kind === 'mc' && value) {
      var btn = qel.querySelector('[data-opt="' + value + '"]');
      if (btn) btn.click();                            // 기존 선택 로직 재사용
    } else if (kind === 'digit' && value != null) {
      var inp = qel.querySelector('[data-input]');
      if (inp) { inp.value = String(value); picks[q] = String(value); }
    }
  }
  function flagQ(q, flag) {
    var qel = grid.querySelector('[data-q="' + q + '"]');
    if (!qel) return;
    qel.classList.toggle('warn', flag !== 'ok');
    var old = qel.querySelector('.warnbadge'); if (old) old.remove();
    if (flag !== 'ok') {
      var s = document.createElement('span'); s.className = 'warnbadge';
      s.textContent = '⚠ ' + ({ blank: '무응답', multi: '중복', ambiguous: '애매' }[flag] || '확인');
      qel.querySelector('.qh').appendChild(s);
    }
  }

  file.onchange = function () {
    var f = file.files[0]; if (!f) return;
    if (!ready()) { msg.textContent = '인식 모듈 준비 중이에요. 잠시 후 다시 시도하거나 수동 입력하세요.'; return; }
    msg.textContent = '인식 중…';
    var img = document.getElementById('omr-img');
    img.onload = function () {
      try {
        var warp = OMRCv.detectAndWarp(img, CARDSPEC);
        if (!warp) { msg.textContent = '카드를 못 찾았어요. 밝은 곳에서 카드 전체가 보이게 다시 촬영하세요.'; return; }
        var res = OMRCore.interpretCard(warp.gray, warp.width, warp.height, CARDSPEC);
        if (CARDSPEC.roundId && res.roundId !== CARDSPEC.roundId) {
          msg.textContent = '이 페이지 회차의 카드가 아니에요(읽은 코드 ' + res.roundId + '). 이 회차 카드를 찍어주세요.';
          return;
        }
        if (window.revealAnswers) window.revealAnswers();   // 인식되면 답 입력 격자 노출
        var ca = document.getElementById('capture-area');   // 촬영 박스를 작게 축소
        if (ca) ca.classList.add('done');
        var lbl = document.querySelector('.camlabel');
        if (lbl) lbl.textContent = '다시 촬영';
        var warn = 0;
        Object.keys(res.answers).forEach(function (q) {
          setPick(q, res.answers[q].kind, res.answers[q].value);
          flagQ(q, res.flags[q]); if (res.flags[q] !== 'ok') warn++;
        });
        msg.textContent = '';
        var rb = document.getElementById('omr-result');
        if (rb) {
          rb.style.display = 'block';
          rb.className = 'result ' + (warn ? 'warn' : 'ok');
          rb.textContent = warn
            ? ('📷 사진을 읽었습니다 — ⚠ 표시된 ' + warn + '문항을 확인·수정 후 채점하세요.')
            : '📷 사진을 읽었습니다 — 확인 후 채점하세요.';
        }
        document.getElementById('omr-preview').style.display = 'block';
      } catch (e) {
        msg.textContent = '인식에 실패했어요. 수동으로 입력해 채점하세요.';

    img.src = URL.createObjectURL(f);
  };
})();
